[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-archive"
version = "0.1.0"
description = "Device-independent SHA-256 based digital archive and recovery system"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ui = ["PySide6>=6.7,<7"]

[project.scripts]
digital-archive = "digital_archive.cli:main"
digital-archive-ui = "digital_archive.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]
